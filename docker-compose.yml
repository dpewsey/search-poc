services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    depends_on:
      - api

  api:
    build: ./api
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-cys}
      POSTGRES_USER: ${POSTGRES_USER:-cys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cys_dev}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cys}
      POSTGRES_USER: ${POSTGRES_USER:-cys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cys_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cys} -d ${POSTGRES_DB:-cys}"]
      interval: 5s
      timeout: 3s
      retries: 5

  transcription:
    build: ./transcription
    volumes:
      - ./transcription/audio:/audio
      - whisper_cache:/root/.cache
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-cys}
      POSTGRES_USER: ${POSTGRES_USER:-cys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cys_dev}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  frontend_node_modules:
  pgdata:
  whisper_cache:
